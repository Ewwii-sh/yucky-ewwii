[package]
name = "yucky-ewwii"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ewwii_plugin_api = "1.5.0"
yuck = { path = "third-party/eww/crates/yuck" }
simplexpr = { path = "third-party/eww/crates/simplexpr" }
eww_shared_util = { path = "third-party/eww/crates/eww_shared_util" }

# reporting errors
ariadne = "0.6.0"
heck = "0.5.0"
chrono = "0.4.45"
serde_json = "1.0.151"
sysinfo = "0.31.2"
once_cell = "1.21.4"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["serde_derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
